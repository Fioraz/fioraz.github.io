  <rect x="530" y="290" width="150" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="543" cy="300" r="5" fill="#22C55E"/>
  <rect x="555" y="295" width="90" height="10" rx="5" fill="#A2B5C7"/>
  <rect x="530" y="318" width="150" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="543" cy="328" r="5" fill="#FACC15"/>
  <rect x="555" y="323" width="70" height="10" rx="5" fill="#CBD5E1"/>
