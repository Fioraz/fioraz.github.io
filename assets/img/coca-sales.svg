<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="32" fill="#FFFFFF"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="90" rx="32" fill="#0F2D4B"/>
  <rect x="60" y="30" width="260" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="60" y="56" width="200" height="8" rx="4" fill="#A2B5C7"/>
  <!-- Filter chips -->
  <rect x="380" y="30" width="120" height="24" rx="12" fill="#007EFC" fill-opacity="0.2"/>
  <rect x="390" y="36" width="80" height="12" rx="6" fill="#E5E7EB"/>
  <rect x="520" y="30" width="120" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="530" y="36" width="80" height="12" rx="6" fill="#CBD5E1"/>
  <!-- Left: map-like US states sales -->
  <rect x="60" y="120" width="320" height="260" rx="20" fill="#F3F4F6"/>
  <rect x="80" y="138" width="180" height="10" rx="5" fill="#A2B5C7"/>
  <!-- Abstract state blocks -->
  <rect x="90" y="170" width="60" height="40" rx="10" fill="#007EFC" fill-opacity="0.9"/>
  <rect x="160" y="170" width="70" height="40" rx="10" fill="#007EFC" fill-opacity="0.7"/>
  <rect x="245" y="170" width="50" height="40" rx="10" fill="#007EFC" fill-opacity="0.5"/>
  <rect x="90" y="220" width="70" height="40" rx="10" fill="#0F2D4B" fill-opacity="0.85"/>
  <rect x="170" y="220" width="60" height="40" rx="10" fill="#0F2D4B" fill-opacity="0.6"/>
  <rect x="240" y="220" width="50" height="40" rx="10" fill="#0F2D4B" fill-opacity="0.45"/>
  <rect x="110" y="270" width="60" height="40" rx="10" fill="#38BDF8" fill-opacity="0.9"/>
  <rect x="190" y="270" width="60" height="40" rx="10" fill="#38BDF8" fill-opacity="0.7"/>
  <!-- Right: operating profit line chart -->
  <rect x="400" y="120" width="340" height="260" rx="20" fill="#F9FAFB"/>
  <rect x="420" y="138" width="190" height="10" rx="5" fill="#A2B5C7"/>
  <!-- Axes -->
  <line x1="430" y1="350" x2="720" y2="350" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="430" y1="170" x2="430" y2="350" stroke="#E5E7EB" stroke-width="2"/>
  <!-- Grid -->
  <line x1="430" y1="200" x2="720" y2="200" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="430" y1="235" x2="720" y2="235" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="430" y1="270" x2="720" y2="270" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="430" y1="305" x2="720" y2="305" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Profit line -->
  <polyline points="442,330 470,310 498,320 526,290 554,275 582,260 610,250 638,235 666,225 694,215"
            stroke="#007EFC" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Points -->
  <circle cx="470" cy="310" r="5" fill="#007EFC"/>
  <circle cx="526" cy="290" r="5" fill="#007EFC"/>
  <circle cx="582" cy="260" r="5" fill="#007EFC"/>
  <circle cx="638" cy="235" r="5" fill="#007EFC"/>
  <circle cx="694" cy="215" r="5" fill="#007EFC"/>
  <!-- Legend -->
  <rect x="440" y="320" width="18" height="6" rx="3" fill="#007EFC"/>
  <rect x="464" y="318" width="80" height="10" rx="5" fill="#CBD5E1"/>
</svg>