<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Contact</title><link rel="stylesheet" href="styles.css"/></head>
<body>
<div id="include-header"></div>
<main class="container">
<section class="section">
<h1>Contact</h1>
<div class="social-grid">
<div class="social-card"><strong>LinkedIn Account</strong><a href="#">www.linkedin.com</a></div>
<div class="social-card"><strong>GitHub Account</strong><a href="#">github.com</a></div>
<div class="social-card"><strong>ORCID Account</strong><a href="#">orcid.org</a></div>
<div class="social-card"><strong>Subscribe to my YouTube Channel</strong><a href="#">YouTube</a></div>
<div class="social-card"><strong>Follow me on Facebook</strong><a href="#">facebook.com</a></div>
</div>


<h2 class="section" style="margin-top:26px">Get in Touch!</h2>
<form class="card" action="#" method="post" style="max-width:720px;margin:12px auto;">
<label class="small">Name *<br><input type="text" name="name" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6eef8"></label>
<label class="small">Email address *<br><input type="email" name="email" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6eef8"></label>
<label class="small">Message *<br><textarea name="message" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6eef8;min-height:130px"></textarea></label>
<label class="small"><input type="checkbox" name="sendcopy"> Send me a copy</label>
<div style="margin-top:12px"><button type="submit" style="background:var(--accent);color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer">Submit form</button></div>
</form>


<p class="small" style="text-align:center;margin-top:8px">Hope you have a lovely day!! ❤️</p>
</section>
</main>
<div class="to-top" title="Back to top"><span>▲</span></div>
<div id="include-footer"></div>
<script src="scripts.js"></script>
</body>
</html>
